name: Build and publish DOC2MD installers

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          if (( GITHUB_RUN_NUMBER < 1 || GITHUB_RUN_NUMBER > 65534 )); then
            echo "Workflow run number cannot be represented as a .NET version component: $GITHUB_RUN_NUMBER" >&2
            exit 1
          fi
          version="1.0.$GITHUB_RUN_NUMBER"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows x64 installer
    needs: version
    runs-on: windows-2025
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install native build dependencies
        shell: pwsh
        run: |
          choco install innosetup libreoffice-fresh tesseract --yes --no-progress
          if ($LASTEXITCODE -notin @(0, 1641, 3010))
          {
              throw "Chocolatey dependency installation failed with exit code $LASTEXITCODE."
          }
      - name: Build and smoke-test installer
        shell: pwsh
        run: ./installer/Build-Installer.ps1 -Version '${{ needs.version.outputs.version }}'
      - name: Test packaged CLI with repository samples
        shell: pwsh
        env:
          DOC2MD_RUN_SAMPLE_TESTS: '1'
          DOC2MD_SAMPLE_TEST_CLI: ${{ github.workspace }}/artifacts/installer-build/payload/DOC2MD.Cli.exe
          DOC2MD_SAMPLE_TEST_TESSDATA: ${{ github.workspace }}/artifacts/installer-build/payload/Resources/tessdata
        run: dotnet test ./tests/DOC2MD.Integration.Tests/DOC2MD.Integration.Tests.csproj --configuration Release --nologo
      - uses: actions/upload-artifact@v6
        with:
          name: installer-win-x64
          path: artifacts/installer/DOC2MD-${{ needs.version.outputs.version }}-win-x64-Setup.exe
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.runtime }} installer
    needs: version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: osx-arm64
            runner: macos-15
          - runtime: osx-x64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Install native build dependencies
        shell: bash
        run: |
          set -euo pipefail
          brew install tesseract dylibbundler
          brew install --cask libreoffice
      - name: Build and smoke-test installer
        shell: bash
        run: ./installer/Build-MacInstaller.sh --version '${{ needs.version.outputs.version }}' --runtime '${{ matrix.runtime }}'
      - name: Test packaged CLI with repository samples
        shell: bash
        env:
          DOC2MD_RUN_SAMPLE_TESTS: '1'
          DOC2MD_SAMPLE_TEST_CLI: ${{ github.workspace }}/artifacts/mac-installer-build/${{ matrix.runtime }}/DOC2MD.app/Contents/MacOS/DOC2MD.Cli
          DOC2MD_SAMPLE_TEST_TESSDATA: ${{ github.workspace }}/artifacts/mac-installer-build/${{ matrix.runtime }}/DOC2MD.app/Contents/Resources/tessdata
        run: dotnet test ./tests/DOC2MD.Integration.Tests/DOC2MD.Integration.Tests.csproj --configuration Release --nologo
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ matrix.runtime }}
          path: |
            artifacts/installer/DOC2MD-${{ needs.version.outputs.version }}-${{ matrix.runtime }}.pkg
            artifacts/installer/DOC2MD-${{ needs.version.outputs.version }}-${{ matrix.runtime }}.pkg.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs:
      - version
      - windows
      - macos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v6
        with:
          pattern: installer-*
          path: artifacts
          merge-multiple: true
      - name: Create checksums and stable aliases
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts
          version='${{ needs.version.outputs.version }}'
          windows="DOC2MD-$version-win-x64-Setup.exe"
          sha256sum "$windows" > "$windows.sha256"
          cp "$windows" DOC2MD-win-x64-Setup.exe
          sha256sum DOC2MD-win-x64-Setup.exe > DOC2MD-win-x64-Setup.exe.sha256
          for runtime in osx-arm64 osx-x64; do
            package="DOC2MD-$version-$runtime.pkg"
            cp "$package" "DOC2MD-$runtime.pkg"
            sha256sum "DOC2MD-$runtime.pkg" > "DOC2MD-$runtime.pkg.sha256"
          done
      - name: Create or update release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "DOC2MD $RELEASE_VERSION" \
              --generate-notes
          fi
          gh release upload "$RELEASE_TAG" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
